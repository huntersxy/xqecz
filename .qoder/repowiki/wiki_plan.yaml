version: 1

# 文件范围：排除归档旧仓、运行时数据与生成产物，聚焦 monorepo 源码本体
scope:
  include: []
  exclude:
    - "archive/**"
    - "node_modules/**"
    - "docker_data/**"
    - "**/dist/**"
    - "proto/gen/**"
    - "packages/worker/proto/**"
    - ".workbuddy/**"
    - ".zcode/**"
    - "pnpm-lock.yaml"

repowiki:
  notes:
    - text: "项目定位是「小泉动漫二创站（xqecz）」——用户上传/浏览二次创作内容（图片、视频、图文、链接），含评论、投票、管理后台；不要推断为教育类平台。"
    - text: "项目已完全弃用 Docker/Nginx 部署，唯一运行方式是 pnpm 脚本本地直启：pnpm dev 并发起 NestJS API(:3000)、Go Worker(:50051)、Vite 前端(:5173)；pnpm start 为生产模式一键构建+运行。"
    - text: "架构铁律：NestJS 独占 MySQL/Redis；Go worker 是无状态 gRPC 计算服务，不连数据库、无 cron，数据经 gRPC 从 NestJS 传入、结果回传 NestJS 落库/写缓存。"
    - text: "packages/frontend/src/api/index.ts 是前后端唯一接口契约，API 响应统一为 { code, message, data } 包装格式。"
    - text: "共享上传目录由 UPLOAD_DIR 环境变量约定，单一配置源为 packages/api/.env；worker 经 scripts/run-worker.mjs 启动时自动读取同一 .env 注入，文件路径经 gRPC 以绝对路径传递。"
    - text: "gRPC 契约定义在 proto/xqecz.proto，NestJS 客户端设 keepCase:true、字段用 snake_case；proto/gen 与 packages/worker/proto 均为生成产物，不要当作手写源码分析。"
    - text: "推荐链路：api 的 ContentService.refreshRecommend() 读 MySQL → gRPC RefreshRecommend 由 worker 纯打分 → api 写 Redis ZSet recommend:hot（ioredis keyPrefix=xqecz:）；读取降级为 view_count 排序。"
    - text: "所有删除均为软删除（deleted_at + TypeORM @DeleteDateColumn 自动过滤）；外部依赖（Tinify/S3/FFmpeg/Worker）缺失一律降级，gRPC 不返 rpc error，只返 success=false + error 文本。"
    - text: "archive/ 目录是已归档的旧后端（xqecz-golang、xqecz-nodejs）与旧独立前端仓库，已全部迁入本 monorepo，不要将其纳入现行架构描述。"
  documents: []

knowledgecard:
  notes:
    - text: "模块划分建议按 packages/api（NestJS 主后端，含 auth/content/comment/poll/admin/api-key/redis/worker 子模块）、packages/worker（Go 无状态 gRPC 服务）、packages/frontend（Vue 3 SPA）、proto（gRPC 契约）四大块组织，勿把 archive/ 归档代码算作现行模块。"
    - text: "NestJS 独占 DB/Redis，Go worker 无状态不连库；跨服务共享 UPLOAD_DIR 的单一配置源是 packages/api/.env（worker 经 scripts/run-worker.mjs 注入）。"
    - text: "项目不使用 Docker，运行方式为根 package.json 的 pnpm 脚本（dev/start/build）经 concurrently 并发三端。"
