$schema: 'https://moonrepo.dev/schemas/project.json'
language: go

tasks:
  build:
    command: 'go build -o xqecz-server ./cmd/server'
    inputs:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
    outputs:
      - 'xqecz-server'
  run:
    command: 'go run ./cmd/server'
    preset: 'server'
  test:
    command: 'go test ./...'
    inputs:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
  lint:
    command: 'go vet ./...'
  fmt:
    command: 'gofmt -w .'
