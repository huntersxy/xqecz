name: Build & Deploy

on:
  push:
    branches: ["master"]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
          run_install: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/worker/go.mod
          cache: true
          cache-dependency-path: packages/worker/go.sum

      # ── 构建 ──

      - name: Build
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter ./packages/api run build
          pnpm --filter ./packages/frontend run build
          cd packages/worker && go build -o xqecz-worker ./cmd/server/ && cd ../..

      - name: Prepare deploy
        run: |
          mkdir -p deploy/packages/api
          mkdir -p deploy/packages/worker
          mkdir -p deploy/packages/frontend
          cp -r packages/api/dist deploy/packages/api/
          cp packages/worker/xqecz-worker deploy/packages/worker/
          cp -r packages/frontend/dist deploy/packages/frontend/

      # ── FTP 上传 ──

      - name: Deploy API
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME_BACKEND }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: deploy/packages/api/dist/
          server-dir: packages/api/dist/
          state-name: .ftp-state-api.json

      - name: Deploy Worker
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME_BACKEND }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: deploy/packages/worker/
          server-dir: packages/worker/
          state-name: .ftp-state-worker.json

      - name: Deploy Frontend
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME_FRONTEND }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: deploy/packages/frontend/dist/
          server-dir: ./
          state-name: .ftp-state-frontend.json
