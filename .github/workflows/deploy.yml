name: Build & Deploy

# 生产形态（2026-09 起）：后端与前端分开部署，不经 pnpm/npm 在服务器上运行。
#   后端 → 宝塔「Go 项目」目录，只传单文件二进制（FTP 账号根即项目目录）
#   前端 → 宝塔「静态站点」根目录，传 dist 产物
on:
  push:
    branches: ["master"]
  workflow_dispatch:
    inputs:
      restart:
        description: 部署后重启后端进程
        type: boolean
        default: true

# 部署不可并发：两次推送同时覆盖二进制会互相打断
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # 面板地址由 FTP_SERVER（secret）拼接，仓库内不出现服务器 IP；健康检查走生产域名的同源 /api
  BT_PANEL_URL: http://${{ secrets.FTP_SERVER }}:13634
  HEALTH_URL: https://xq.xiey.work/api/health

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: packages/server/go.mod
          cache: true
          cache-dependency-path: packages/server/go.sum

      # ── 构建（两端独立产物，互不依赖）──

      - name: Build frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter ./packages/frontend run build

      - name: Build server
        working-directory: packages/server
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: go build -ldflags="-s -w" -o xqecz-server ./cmd/server

      - name: Prepare artifacts
        run: |
          mkdir -p deploy/frontend
          cp packages/server/xqecz-server deploy/xqecz-server
          cp -r packages/frontend/dist/. deploy/frontend/
          ls -la deploy deploy/frontend | head -30

      # ── 后端：单文件直传 FTP（账号根＝/www/wwwroot/xqecz-golang）──
      # 用 curl 而非同步 Action：只覆盖 xqecz-server，绝不触碰同目录的 .env、data/

      - name: Deploy server binary
        run: |
          curl -sS --fail --retry 3 --retry-delay 5 -m 900 \
            -T deploy/xqecz-server \
            -u "${{ secrets.FTP_USERNAME_BACKEND }}:${{ secrets.FTP_PASSWORD }}" \
            "ftp://${{ secrets.FTP_SERVER }}/xqecz-server"
          echo "后端二进制已上传"

      # ── 前端：静态站点根目录（增量同步 dist）──

      - name: Deploy frontend
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME_FRONTEND }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: deploy/frontend/
          server-dir: ./
          state-name: .ftp-state-frontend.json

      # ── 收尾：赋可执行位并重启后端 ──
      # 宝塔新版的站点/项目 HTTP 端点已不可用（/project/go/*、/site?action=AddSite 均 404），
      # 这里改用面板文件接口的 ExecShell 远程执行；重启方式与面板启动一致（www 用户 + 追加上面板日志）。

      - name: Activate & restart backend
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.restart }}
        env:
          BT_API_TOKEN: ${{ secrets.BT_API_TOKEN }}
        run: |
          set -euo pipefail
          T=$(date +%s)
          TK=$(printf '%s%s' "$T" "$(printf '%s' "$BT_API_TOKEN" | md5sum | cut -d' ' -f1)" | md5sum | cut -d' ' -f1)

          cat > /tmp/restart.sh <<'SH'
          set -e
          cd /www/wwwroot/xqecz-golang
          chmod +x xqecz-server
          pkill -f 'xqecz-golang/xqecz-server' || true
          sleep 2
          setsid runuser -u www -- /www/wwwroot/xqecz-golang/xqecz-server \
            >> /www/wwwlogs/go/xqeczserver.log 2>&1 &
          sleep 3
          echo "restart-done"
          SH

          curl -sS --fail -m 60 -X POST \
            "$BT_PANEL_URL/files?action=ExecShell&request_time=$T&request_token=$TK" \
            --data-urlencode "path=/www/wwwroot/xqecz-golang" \
            --data-urlencode "shell@/tmp/restart.sh"
          echo "重启指令已下发"

      # 部署是否真的生效，以生产探针为准（面板 ExecShell 为异步执行，只能事后校验）

      - name: Verify production health
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 10 "$HEALTH_URL" || true)
            if [ "$code" = "200" ]; then
              echo "健康检查通过：$HEALTH_URL"
              exit 0
            fi
            echo "第 $i 次探测返回 $code，3s 后重试"
            sleep 3
          done
          echo "健康检查失败：$HEALTH_URL 未返回 200"
          exit 1
