name: Build & Deploy

# 生产形态（2026-09 起）：后端与前端分开部署，不经 pnpm/npm 在服务器上运行。
#   后端 → 宝塔「Go 项目」目录，只传单文件二进制（FTP 账号根即项目目录）
#   前端 → 宝塔「静态站点」根目录，传 dist 产物
on:
  push:
    branches: ["master"]
  workflow_dispatch:
    inputs:
      restart:
        description: 部署后重启后端进程
        type: boolean
        default: true

# 部署不可并发：两次推送同时覆盖二进制会互相打断
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # 面板地址由 FTP_SERVER（secret）拼接，仓库内不出现服务器 IP；健康检查走生产域名的同源 /api
  BT_PANEL_URL: http://${{ secrets.FTP_SERVER }}:13634
  HEALTH_URL: https://xq.xiey.work/api/health

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: packages/server/go.mod
          cache: true
          cache-dependency-path: packages/server/go.sum

      # ── 构建（两端独立产物，互不依赖）──

      - name: Build frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter ./packages/frontend run build

      - name: Build server
        working-directory: packages/server
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: go build -ldflags="-s -w" -o xqecz-server ./cmd/server

      - name: Prepare artifacts
        run: |
          mkdir -p deploy/frontend
          cp packages/server/xqecz-server deploy/xqecz-server
          cp -r packages/frontend/dist/. deploy/frontend/
          ls -la deploy deploy/frontend | head -30

      # ── 后端：单文件直传 FTP（账号根＝/www/wwwroot/xqecz-golang）──
      # 用 curl 而非同步 Action：只覆盖 xqecz-server，绝不触碰同目录的 .env、data/
      # 必须传成 .new：直接覆盖「正在运行的二进制」会被内核拒绝（ETXTBSY，pure-ftpd 回 553），
      # 服务器侧再用 mv 原子替换（不改变运行中进程持有的 inode）后重启。

      - name: Deploy server binary
        run: |
          curl -sS --fail --retry 3 --retry-delay 5 -m 900 \
            -T deploy/xqecz-server \
            -u "bankend:${{ secrets.FTP_PASSWORD }}" \
            "ftp://${{ secrets.FTP_SERVER }}/xqecz-server.new"
          echo "后端二进制已上传为 xqecz-server.new"

      # ── 前端：静态站点根目录（增量同步 dist）──
      # 站点目录若混入 root 属主的文件（例如手工用 root 传过 vditor），FTP 用户 www 写不进去，
      # 上传会报 553 Permission denied —— 因此上传前统一纠偏，保留宝塔的 .user.ini（root + 不可变）。

      - name: Ensure frontend ownership
        env:
          BT_API_TOKEN: ${{ secrets.BT_API_TOKEN }}
        run: |
          set -euo pipefail
          sign() {
            local t; t=$(date +%s)
            printf 'request_time=%s&request_token=%s' "$t" \
              "$(printf '%s%s' "$t" "$(printf '%s' "$BT_API_TOKEN" | md5sum | cut -d' ' -f1)" | md5sum | cut -d' ' -f1)"
          }
          TAG="fixown-$(date +%s)"
          cat > /tmp/fixown.sh <<SH
          set -e
          cd /www/wwwroot/xq.xiey.work
          find . -path ./.user.ini -prune -o ! -user www -print0 | xargs -0 -r chown www:www 2>/dev/null || true
          echo "$TAG"
          SH

          curl -sS --fail -m 60 -X POST "$BT_PANEL_URL/files?action=ExecShell&$(sign)" \
            --data-urlencode "path=/www/wwwroot/xq.xiey.work" \
            --data-urlencode "shell@/tmp/fixown.sh"

          for i in $(seq 1 15); do
            out=$(curl -sS -m 30 -X POST "$BT_PANEL_URL/files?action=GetExecShellMsg&$(sign)")
            case "$out" in *"$TAG"*) echo "站点目录属主已纠偏"; exit 0;; esac
            sleep 2
          done
          echo "属主纠偏未确认，继续部署"

      - name: Deploy frontend
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: xqdm
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: deploy/frontend/
          server-dir: ./
          state-name: .ftp-state-frontend.json
          exclude: |
            **/.user.ini
            **/.git*
            **/.DS_Store

      # ── 收尾：替换二进制并重启后端 ──
      # 宝塔新版的站点/项目 HTTP 端点已不可用（/project/go/*、/site?action=AddSite 均 404），
      # 这里改用面板文件接口的 ExecShell 远程执行；重启方式与面板启动一致（www 用户 + 追加上面板日志）。

      - name: Activate & restart backend
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.restart }}
        env:
          BT_API_TOKEN: ${{ secrets.BT_API_TOKEN }}
        run: |
          set -euo pipefail
          T=$(date +%s)
          TK=$(printf '%s%s' "$T" "$(printf '%s' "$BT_API_TOKEN" | md5sum | cut -d' ' -f1)" | md5sum | cut -d' ' -f1)

          cat > /tmp/restart.sh <<'SH'
          set -e
          cd /www/wwwroot/xqecz-golang
          if [ ! -f xqecz-server.new ]; then
            echo "未找到 xqecz-server.new，取消替换与重启"
            exit 1
          fi
          chmod +x xqecz-server.new
          chown www:www xqecz-server.new
          mv -f xqecz-server.new xqecz-server
          pkill -f 'xqecz-golang/xqecz-server' || true
          sleep 2
          setsid runuser -u www -- /www/wwwroot/xqecz-golang/xqecz-server \
            >> /www/wwwlogs/go/xqeczserver.log 2>&1 &
          sleep 3
          echo "restart-done"
          SH

          curl -sS --fail -m 60 -X POST \
            "$BT_PANEL_URL/files?action=ExecShell&request_time=$T&request_token=$TK" \
            --data-urlencode "path=/www/wwwroot/xqecz-golang" \
            --data-urlencode "shell@/tmp/restart.sh"
          echo "替换与重启指令已下发"

      # 部署是否真的生效，以生产探针为准（面板 ExecShell 为异步执行，只能事后校验）

      - name: Verify production health
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 10 "$HEALTH_URL" || true)
            if [ "$code" = "200" ]; then
              echo "健康检查通过：$HEALTH_URL"
              break
            fi
            echo "第 $i 次探测返回 $code，3s 后重试"
            sleep 3
          done
          if [ "${code:-}" != "200" ]; then
            echo "健康检查失败：$HEALTH_URL 未返回 200"
            exit 1
          fi

      # 健康检查只看「服务活着」，而 FTP 覆盖、面板异步 exec、pkill/setsid 任何一环
      # 静默失败时服务照样健康：此时上线的是上一版二进制，健康检查不会报错，若接口形状变了
      # 就会以「成功」的姿态停留在旧产物上。这里直接比对「被判活的进程」与本次上传的二进制。
      # 健康检查只看「服务活着」：FTP 覆盖、面板异步 exec、pkill+setsid 任一环静默失败时，
      # 服务照样 200，实际跑的还是上一版二进制（本轮就发生过一次，接口形状没变回旧版才发现）。
      # 这里直接问服务器：被判活的那个进程，跑的到底是本次上传的二进制，还是上一版。
      # 写成文件再取回，是因为面板 exec 的异步输出不便解析（本步骤初版就卡在这里）。
      - name: Verify running binary is this build
        env:
          BT_API_TOKEN: ${{ secrets.BT_API_TOKEN }}
        run: |
          set -euo pipefail
          T=$(date +%s)
          TK=$(printf '%s%s' "$T" "$(printf '%s' "$BT_API_TOKEN" | md5sum | cut -d' ' -f1)" | md5sum | cut -d' ' -f1)
          SIGN="request_time=$T&request_token=$TK"
          cat > /tmp/assert.sh <<'SH'
          OUT=/www/wwwroot/xqecz-golang/.deploy-assert.txt
          BIN=/www/wwwroot/xqecz-golang/xqecz-server
          : > "$OUT"
          n=$(pgrep -fc 'xqecz-golang/xqecz-server' || true)
          [ -n "$n" ] || n=0
          pid=$(pgrep -f 'xqecz-golang/xqecz-server' | head -1 || true)
          binmd5=$(md5sum "$BIN" | cut -d' ' -f1)
          exe=$(readlink /proc/$pid/exe 2>/dev/null || true)
          runmd5=""
          if [ -n "$exe" ]; then
            runmd5=$(setpriv --reuid=www --regid=www --clear-groups md5sum "$exe" 2>/dev/null | cut -d' ' -f1 || true)
          fi
          {
            echo "count=$n"
            echo "bin=$binmd5"
            echo "exe=${exe:-unknown}"
            echo "running=${runmd5:-unknown}"
          } > "$OUT"
          SH

          posted=$(curl -sS -m 60 -X POST "$BT_PANEL_URL/files?action=ExecShell&$SIGN" \
            --data-urlencode "path=/www/wwwroot/xqecz-golang" \
            --data-urlencode "shell@/tmp/assert.sh" || true)
          echo "exec 响应：$posted"

          body=""
          for i in $(seq 1 10); do
            sleep 3
            body=$(curl -sS -m 30 -X POST "$BT_PANEL_URL/files?action=GetFileBody&$SIGN" \
              --data-urlencode "path=/www/wwwroot/xqecz-golang/.deploy-assert.txt" || true)
            if printf '%s' "$body" | grep -q 'count='; then
              break
            fi
            echo "第 $i 次等待服务器写回校验结果：$(printf '%s' "$body" | head -c 120)"
          done
          printf '%s\n' "$body"

          get() { printf '%s' "$body" | tr -d '\r' | grep -o "$1=[^ ]*" | head -1 | cut -d= -f2; }
          count=$(get count); binmd5=$(get bin); runmd5=$(get running)
          if [ -z "$count" ]; then echo "没读到校验结果"; exit 1; fi
          if [ "$count" != "1" ]; then echo "后端实例数=$count（应为 1）"; exit 1; fi
          if [ -z "$runmd5" ] || [ "$runmd5" = "unknown" ]; then echo "读不到运行进程的二进制"; exit 1; fi
          if [ "$binmd5" != "$runmd5" ]; then
            echo "运行中的不是本次上传的二进制：bin=$binmd5 running=$runmd5"
            exit 1
          fi
          echo "产物校验通过：被判活的进程就是本次部署的二进制（md5=$binmd5）"
