name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server · go vet & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: packages/server/go.mod
          cache: true
          cache-dependency-path: packages/server/go.sum

      - name: Vet
        working-directory: packages/server
        run: go vet ./...

      - name: Test
        working-directory: packages/server
        run: go test ./... -coverprofile=coverage.out -covermode=atomic

      - name: Build
        working-directory: packages/server
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -o xqecz-server ./cmd/server

      - name: Upload coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: packages/server/coverage.out
          flags: server
          fail_ci_if_error: false

  frontend:
    name: Frontend · type-check & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm --filter ./packages/frontend run type-check

      - name: Tests
        run: pnpm --filter ./packages/frontend run test
