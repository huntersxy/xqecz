packages:
  - 'packages/*'
allowBuilds:
  '@parcel/watcher': true
  core-js: true
  protobufjs: set this to true or false
  sharp: true
  vue-demi: true
minimumReleaseAgeExclude:
  - baseline-browser-mapping@2.11.23
onlyBuiltDependencies:
  - '@parcel/watcher'
  - core-js
  - sharp
  - vue-demi

# 传递依赖安全覆盖。
# 上游把传递依赖精确锁死时，pnpm update 无法推进，只能在此钉住；
# 每项都保持在自身大版本内，避免跨大版本行为变更。
# 注意：pnpm 11 起不再读取 package.json 的 pnpm 字段，设置必须写在本文件。
overrides:
  brace-expansion@1: '1.1.18'
  brace-expansion@2: '2.1.4'
  brace-expansion@5: '5.0.9'
  fast-uri@3: '3.1.6'
  js-yaml@4: '4.3.2'
  browserslist@4: '4.28.9'
  nanoid@3: '3.3.18'
  ini@1: '1.3.6'
  postcss@8: '8.5.28'
  qs@6: '6.16.0'
  baseline-browser-mapping@2: '2.11.23'
