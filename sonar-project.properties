# SonarCloud configuration
# GitHub App: https://github.com/marketplace/sonarcloud
# After signing in, verify/adjust projectKey + organization to match your SonarCloud org.
sonar.projectKey=huntersxy_xqecz
sonar.organization=huntersxy
sonar.host.url=https://sonarcloud.io

sonar.sourceEncoding=UTF-8

sonar.sources=packages/api/src,packages/frontend/src,packages/worker
sonar.tests=packages/frontend/src,packages/worker
sonar.test.inclusions=**/*.test.ts,**/*_test.go,**/__tests__/**

sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/__tests__/**,**/*.config.*

# Coverage: worker only for now (frontend needs @vitest/coverage-v8 before enabling)
sonar.go.coverage.reportPaths=packages/worker/coverage.out
