# SonarCloud configuration
# GitHub App: https://github.com/marketplace/sonarcloud
# SonarCloud org key is xieying996 (display name: huntersxy).
sonar.projectKey=huntersxy_xqecz-monorepo
sonar.organization=xieying996
sonar.host.url=https://sonarcloud.io

sonar.sourceEncoding=UTF-8

sonar.sources=packages/server,packages/frontend/src
sonar.tests=packages/frontend/src,packages/server
sonar.test.inclusions=**/*.test.ts,**/*_test.go,**/__tests__/**

sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/__tests__/**,**/*.config.*

# Coverage: Go 后端（前端需 @vitest/coverage-v8 后才能开启）
sonar.go.coverage.reportPaths=packages/server/coverage.out
